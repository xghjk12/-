<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>轻音播放 · M0 技术验证</title>
<style>
  :root { color-scheme: dark; }
  body {
    margin: 0; padding: 24px;
    font: 14px/1.6 system-ui, "Microsoft YaHei", sans-serif;
    background: #14161a; color: #dfe3e8;
  }
  h1 { font-size: 18px; margin: 0 0 4px; }
  h2 { font-size: 15px; margin: 28px 0 8px; color: #9fb3c8; }
  p.lead { color: #8b98a8; margin: 0 0 20px; }
  button {
    font: inherit; padding: 8px 16px; margin-right: 8px; cursor: pointer;
    background: #2f6f4f; color: #fff; border: 0; border-radius: 6px;
  }
  button.secondary { background: #2a323c; }
  button:disabled { opacity: .5; cursor: default; }
  table { border-collapse: collapse; width: 100%; margin-top: 12px; font-size: 13px; }
  th, td { text-align: left; padding: 6px 10px; border-bottom: 1px solid #262c34; }
  th { color: #8b98a8; font-weight: 500; }
  td.num { text-align: right; font-variant-numeric: tabular-nums; }
  .ok { color: #63c98a; }
  .bad { color: #e06c75; }
  .warn { color: #d9a441; }
  #log { margin-top: 12px; color: #8b98a8; white-space: pre-wrap; }
  .cover { width: 28px; height: 28px; object-fit: cover; border-radius: 4px; vertical-align: middle; }
  .summary { margin-top: 12px; padding: 12px 16px; background: #1b1f25; border-radius: 8px; }
  .summary div { display: flex; gap: 12px; }
  .summary dt { color: #8b98a8; min-width: 140px; }
</style>
</head>
<body>

<h1>轻音播放 · M0 技术验证</h1>
<p class="lead">
  验证动手实现之前的两个假设：music-metadata 能在浏览器里用、目录递归遍历顺畅。
  数据全部留在本机，不会上传。
</p>

<button id="selfTest">运行内置自检</button>
<button id="pick" class="secondary">选择音乐文件夹</button>
<button id="fallback" class="secondary">用 input 回退路</button>
<input id="fallbackInput" type="file" webkitdirectory multiple hidden />

<div id="log">准备就绪。</div>

<div id="selfTestResult"></div>
<div id="libraryResult"></div>

<script type="module" src="./main.ts"></script>
</body>
</html>
